name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q ZentraLauncher.zip -d src
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7
      - run: gradle assembleDebug --no-daemon
        working-directory: src/ZentraLauncher
      - uses: actions/upload-artifact@v4
        with:
          name: ZentraRPG-APK
          path: src/ZentraLauncher/app/build/outputs/apk/debug/app-debug.apk
